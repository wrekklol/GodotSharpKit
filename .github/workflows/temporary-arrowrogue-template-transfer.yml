name: Temporary ArrowRogue Android Template Transfer

on:
  push:
    branches:
      - ci/arrowrogue-template-transfer-20260723
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  resolve-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Resolve signed release asset URL
        shell: bash
        run: |
          set -euo pipefail
          ASSET='https://github.com/wrekklol/GodotSharpKit/releases/download/temp-arrowrogue-template-20260723/Godot_4.8-dev1_android_debug.apk'
          EFFECTIVE="$(curl -sS -L --fail --range 0-0 -o /dev/null -w '%{url_effective}' "$ASSET")"
          test -n "$EFFECTIVE"
          echo "SIGNED_URL=$EFFECTIVE"

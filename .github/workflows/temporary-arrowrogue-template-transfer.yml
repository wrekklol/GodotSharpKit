name: Temporary ArrowRogue Android Template Transfer

on:
  push:
    branches:
      - ci/arrowrogue-template-transfer-20260723
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  resolve-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TEMP_TAG: temp-arrowrogue-template-20260723
    steps:
      - name: Print release metadata and exact asset URLs
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TEMP_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets

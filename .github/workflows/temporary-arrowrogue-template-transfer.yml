name: Temporary ArrowRogue Android Template Transfer

on:
  push:
    branches:
      - ci/arrowrogue-template-transfer-20260723
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: ci/arrowrogue-template-transfer-20260723
          fetch-depth: 0

      - name: Extract and split exact Godot Android debug template
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/godot-template-transfer"
          mkdir -p "$WORK" transfer
          curl -sS -L --fail --retry 5 --retry-all-errors \
            'https://github.com/godotengine/godot-builds/releases/download/4.8-dev1/Godot_v4.8-dev1_export_templates.tpz' \
            -o "$WORK/templates.tpz"
          unzip -qq -j "$WORK/templates.tpz" templates/android_debug.apk templates/version.txt -d "$WORK"
          test "$(stat -c '%s' "$WORK/android_debug.apk")" = '128045261'
          echo '63d2deb02cab6f5fc693dfd344922072d933f412816915b06a098085bbff5b45  android_debug.apk' \
            | (cd "$WORK" && sha256sum -c -)
          split -b 90000000 -d -a 2 "$WORK/android_debug.apk" transfer/android_debug.apk.part-
          cp "$WORK/version.txt" transfer/version.txt
          sha256sum transfer/android_debug.apk.part-* > transfer/PART_SHA256SUMS.txt
          cat > transfer/RECONSTRUCT.txt <<'EOF'
          cat android_debug.apk.part-00 android_debug.apk.part-01 > android_debug.apk
          Expected size: 128045261 bytes
          Expected SHA-256: 63d2deb02cab6f5fc693dfd344922072d933f412816915b06a098085bbff5b45
          EOF
          stat -c '%n %s' transfer/* > transfer/SIZES.txt
          cat transfer/SIZES.txt

      - name: Commit temporary transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer
          git commit -m 'ci: publish temporary Godot Android template chunks [template-transfer]'
          git push origin HEAD:ci/arrowrogue-template-transfer-20260723
